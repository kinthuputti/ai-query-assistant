server.port=8080
spring.application.name=ai-query-assistant

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/assistant
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ollama chat
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3

# Ollama embeddings (must use same model for consistent dimensions)
spring.ai.ollama.embedding.options.model=llama3

# PgVector — auto-creates vector table on startup
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Actuator + Prometheus
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.access=unrestricted